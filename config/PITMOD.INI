[XInput]
; Automatically select Enable Joystick once when controller 1 is connected at
; startup. You can still turn the checkbox off afterward.
AutoEnableJoystick=1

; Detect controller 1 while the game is already running. Connecting it marks
; the joystick available and enables it; disconnecting disables it cleanly.
HotPlug=1

; Also send keyboard 1, 2, and 3 for Pitfall's Simon-style bonus sequences.
; Values are legacy joystick button numbers: 1=A, 2=B, 3=X, 4=Y,
; 5=LB, 6=RB, 7=Back, 8=Start, 9=LS, 10=RS, 11=LT, 12=RT.
; Set a value to 0 to disable that bonus-key mapping.
; These and the shortcuts below can also be captured on the PitMod Input tab;
; click a binding and wait five seconds without input to clear it.
BonusKey1Button=1
BonusKey2Button=2
BonusKey3Button=3

; Configurable controller shortcuts. Values use the button numbers listed
; above; set any value to 0 (None) to leave that command unmapped.
PauseButton=8
FullscreenButton=7
MusicButton=5
AmbientButton=6
; While Direct3D fullscreen is active, LT/RT cycle through Scaling modes.
VideoPreviousButton=11
VideoNextButton=12
; Optional shortcuts to cycle None, Scanlines, CRT, XBR, and FSR in fullscreen.
FilterPreviousButton=0
FilterNextButton=0

; XInput vibration for identified player-action sound effects. Strengths are
; percentages from 0 to 100. Set Rumble=0 to disable all vibration.
Rumble=1
RumbleActionPercent=18
RumbleImpactPercent=40
; Used by the sound shared between a grenade throw and one damage grunt.
RumbleSharedGruntPercent=38
RumbleExplosionPercent=55
RumbleDamagePercent=65
RumbleMovementPercent=12
RumbleRopePercent=5
RumbleVerticalSlidePercent=4
RumbleZiplinePercent=16
