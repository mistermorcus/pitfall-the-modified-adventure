[Audio]
; Auto uses files from MusicFolder when present, otherwise the original CD.
; Other choices: Files, CD, Off.
MusicBackend=Auto
MusicFolder=music

[Video]
; Choices: Integer4:3 (intended CRT shape), IntegerNative (square-pixel
; 320x200/16:10), Integer16:9, Fit4:3, FitNative, StretchToDisplay.
; Integer modes preserve an exact multiple of the native 200-line height;
; aspect-correct modes may stretch horizontally.
Scaling=Integer4:3
; Choices: None, Scanlines, CRT, XBR, FSR. XBR preserves hard pixel edges;
; FSR is an FSR 1-style edge-adaptive 2x upscale and sharpen pass.
Filter=None

